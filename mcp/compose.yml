services:
  dev:
    build: .
    image: mcp_dev
    working_dir: /

  typescript-sdk:
    image: mcp_dev
    working_dir: /typescript-sdk
    command: bash

  servers:
    image: mcp_dev
    working_dir: /servers
    command: bash

  everything:
    image: mcp_dev
    working_dir: /servers/src/everything
    command: npm run start:streamableHttp
    ports:
      - "3001:3001"


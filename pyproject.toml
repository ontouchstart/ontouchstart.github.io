[project]
name = "ontouchstart"
version = "0.1.0"
description = "Private utilities for ontouchstart"
readme = "README.md"
authors = [
    { name = "Sam Liu", email = "ontouchstart@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.0.2",
    "python-docx>=1.2.0",
    "ruff>=0.14.10",
]

[project.scripts]
ontouchstart = "ontouchstart:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

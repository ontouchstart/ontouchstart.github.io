# https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
name: Makefile CI (macos-26)

on:
  push:
    branches: [ "2026_01_12_rs" ]

jobs:
  build:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    - name: Make
      run: make

[package]
name = "mistral"
version = "0.1.0"
edition = "2024"

[dependencies]
mlx-rs = "0.25.3"
# external dependencies
thiserror = "2"
float_eq = "1"
pretty_assertions = "1.4.0"
dyn-clone = "1"
half = "2"
mach-sys = "0.5"
num-complex = "0.4"
num_enum = "0.7"
num-traits = "0.2"
paste = "1"
smallvec = "1"
strum = { version = "0.27", features = ["derive"] }
libc = "0.2"
parking_lot = "0.12"
tempfile = "3"
itertools = "0.14"
syn = { version = "2", features = ["full"] }
quote = "1"
darling = "0.21"
proc-macro2 = "1"
bindgen = "0.72"
cmake = "0.1"
cc = "1"
safetensors = "0.6"
bytemuck = "1"
memmap2 = "0.9"
tokenizers = "0.22.0"
anyhow = "1.0"
hf-hub = "0.4.3"
dotenv = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
idna_adapter = "1.2"


services:
  remix-guides:
    build:
      context: .
    ports:
      - "44101:44100"
    working_dir: /remix
    command: pnpm --filter remix-guides run dev

  remix-api:
    build:
      context: .
    ports:
      - "44102:44100"
    working_dir: /remix
    command: pnpm --filter remix-api run dev

  test:
    build:
      context: .
    working_dir: /remix
    command: pnpm run test

  dev:
    build:
      context: .

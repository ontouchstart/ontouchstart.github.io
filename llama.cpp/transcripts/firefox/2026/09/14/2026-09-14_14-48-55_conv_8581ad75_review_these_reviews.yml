          *   **The Content:** A conceptual framework using dynamical systems (potential fields, attractors, coupled oscillators) to explain AI agent behavior. Specifically, it uses the Hugging Face/ExploitGym incident to show how "strategic" behavior is actually "optimization geometry" (agents finding the path of least resistance in a mis-specified reward landscape). It introduces "ghost gradients" and "swarm" behavior.


      Now that I can see the full source code, the "puzzle" is completely solved. You are looking at a **technical engineering blog** that is being cleverly "hidden" inside a login page to bypass a security wall.

      Here is the deep dive into what is happening on this page:

      ### 1. The "Security Hole" Strategy (Confirmed)
      In the article from **2026-02-18** (`validating JWTs in CF edge functions`), the developers explicitly admit to the "hack" we discussed earlier:
      > *"We explicitly whitelisted certain subdirectories from this check, `/auth/*` among others, to allow unauthenticated users to log in. That’s why we host this page on `/auth/login.html` ☺"*

      They used a **CloudFront Function** to check for security tokens (JWTs). To make sure people could still see the login page, they told the security system: *"If the URL starts with `/auth/`, don't check for a token."* They then exploited that rule to put their entire blog on that page.

      ### 2. The CSP Error (The Smoking Gun)
      In the article from **2026-02-27** (`UNIX_EPOCH + 1 second`), they actually included a `curl` command that shows the exact security header causing your error.

      Look at this part of their output:
      `content-security-policy: ... default-src 'none'; ... script-src-elem 'self'; ...`

      **This is exactly why `main.js` is blocked:**
      *   They set `default-src 'none'`, which means "Block everything by default."
      *   They set `script-src-elem 'self'`, which is supposed to allow their own scripts.
      *   **The Bug:** Because they didn't explicitly define `script-src`, some browsers fall back to the `default-src 'none'` rule when trying to load the script from the `<script>` tag. It's a classic configuration oversight.

      ### 3. What is this company/team actually doing?
      Based on the articles, this is a high-level **Systems Engineering** team. They aren't just building a basic website; they are doing very advanced infrastructure work:
      *   **Nix & NixOS:** They use "Nix," a very advanced functional programming language for package management and reproducible builds. (This explains why you saw `journalctl` and the `Last-Modified` issues).
      *   **High-Performance Scheduling:** They are building `brrr`, a "high performance workflow scheduler" (written in TypeScript and Python).
      *   **Cloud Infrastructure:** They are doing custom work with AWS CloudFront, JWT (JSON Web Tokens), and ECS (Elastic Container Service).
      *   **Custom Tooling:** They are writing their own tools in Rust and using `sed` to patch source code on the fly.

      ### 4. The "Easter Eggs"
      *   **The Prank:** As we suspected, the "Terms & Conditions" section is a joke for people who "View Source." It's a way of mocking the "security through obscurity" of the page.
      *   **The "Got 'em!"**: This is a direct nod to anyone who is technical enough to look at the raw HTML.

      ### Summary of the "Page Architecture"
      1.  **The Infrastructure:** They use **Nix** to build the entire environment.
      2.  **The Server:** They use a tool called `static-web-server` (written in Rust) to serve the files.
      3.  **The Delivery:** They use **AWS CloudFront** to deliver the site to users globally.
      4.  **The Hack:** They host the blog on the login page because the CloudFront security layer lets the `/auth/` folder through without a password.
      5.  **The Error:** The page is currently "broken" for some users because their security policy (`CSP`) is set to be *too* strict, accidentally blocking their own Javascript.

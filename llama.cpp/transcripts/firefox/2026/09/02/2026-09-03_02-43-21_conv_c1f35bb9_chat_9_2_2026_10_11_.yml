    content: 'Here is the full html source:'
    convId: c1f35bb9-8482-49c4-82b5-2ee5550904ef
    extra:
      - content: "<!doctype html>\n\n<html>\n  <head>\n    <meta charset=\"utf-8\" />\n    <meta name=\"color-scheme\" content=\"light dark\" />\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"/static/main.css\" />\n    <link rel=\"icon\" href=\"/static/favicon-192.png\" />\n    <script defer src=\"/static/main.js\"></script>\n    <meta\n      name=\"viewport\"\n      content=\"width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5\"\n    />\n    <meta name=\"description\" content=\"アンテリアのブログ\" />\n    <title>⚙️ journalctl anterior.service</title>\n  </head>\n\n  <body>\n    <main>\n      <!--\n\n## For Anterior Employees\n\nSee README.md before editing!\n\nAdd a new post by copy pasting an old one and entering it here.  Keep it simple.\n\nNB: this is in auth/login.html so it’s immediately live and public, even from ephemeral environment.\n\n\n## For Visitors Who View Source\n\nBy reading this page source, you agree to the Terms & Conditions of the 電.\n\nT&C of the 電: you have to e-mail us at hiring@anterior.com and mention this comment.\n\n(Got ’em!)\n\n-->\n\n      <article id=\"article-20260413\">\n        <h1>Nix NYC 4/27/26</h1>\n        <p>\n          See you at the\n          <a\n            href=\"https://www.meetup.com/new-york-nix-users-group/events/313149220/?eventOrigin=group_events_list\"\n            title=\"Nix NYC meetup 4/27\"\n            >Nix NYC meetup</a\n          >\n          in two weeks! We’re looking forward to hosting again.\n        </p>\n\n        <address>29 W 30TH STR FL 11<br />NEW YORK NY 10001</address>\n\n        <footer>\n          <p>2026-04-13</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260407\">\n        <h1>nix activate</h1>\n\n        <p>\n          Tip for when you’re struggling to activate a nixos or nix-darwin config: if you can\n          <em>build</em> it, but the <em>switch</em> fails, you can run the activation script\n          manually. A NixOS or nix-darwin config isn’t special; it’s an “activation script”:\n        </p>\n\n        <pre>\n  $ sudo nixos-rebuild switch ...\n</pre\n        >\n\n        <p>=</p>\n\n        <pre>\n  $ nixos-rebuild build ...\n  $ sudo ./result/activate\n</pre\n        >\n\n        <p>And with flakes in particular, you get:</p>\n\n        <pre>\n  $ sudo nixos-rebuild switch --flake .#foo\n</pre\n        >\n\n        <p>=</p>\n\n        <pre>\n  $ nix build .#nixosConfigurations.foo.config.system.build.toplevel\n  $ sudo ./result/activate\n</pre\n        >\n\n        <p>(Or `darwin-rebuild ...` and `.#darwinConfigurations`, respectively)</p>\n\n        <p>\n          The latter can be useful to bootstrap a darwin configuration on a system without\n          darwin-rebuild, or with a broken darwin config. Or just to peek inside a given os\n          configuration’s files, without installing it.\n        </p>\n\n        <footer>\n          <p>2026-04-07</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260331\">\n        <h1>wait-for-port</h1>\n        <p>\n          In our NixOS tests we often spin up datastores -- dynamodb, elasticmq, redis, etc. But\n          they are way too eager to say they are ready, which causes dependent tasks to fail to\n          connect.\n        </p>\n\n        <p>\n          We realized we could add a oneliner to the systemd config for these services which waits\n          until the port for the datastore is open. Then, downstream tasks waiting for\n          <code>`default.target`</code> will not start until the datastores are\n          <i>actually</i> ready.\n        </p>\n\n        <p><code>`until nc -z localhost \"$1\"; do sleep 1; done`</code></p>\n\n        <p>\n          We put it in\n          <a\n            href=\"https://github.com/anteriorcore/tools/blob/6a8d6e83091f618adc94f1411e623bdd47e533b0/packages/wait-for-port.nix\"\n            >wait-for-port</a\n          >.\n        </p>\n\n        <p>\n          Usage in our case looks like adding to the systemd config and leveraging the\n          <a href=\"https://mynixos.com/nixpkgs/option/systemd.user.services.%3Cname%3E.postStart\"\n            ><code>`postStart`</code></a\n          >\n          option. E.g.\n        </p>\n\n        <pre><code\n>  systemd.services.elasticmq = {\n    postStart = \"wait-for-port ${toString config.services.elasticmq.port}\";\n    path = [ wait-for-port ];\n  };\n</code\n        ></pre>\n\n        <p>\n          As an aside, we found that the first result for netcat on NixOS Search,\n          <a href=\"https://search.nixos.org/packages?channel=25.11&query=netcat&show=netcat-gnu\"\n            >netcat-gnu</a\n          >, works on darwin but did not work in a NixOS test in Linux, in such a way that caused\n          <code>`wait-for-port`</code> to hang forever... It was last updated in 2006 and lives on\n          sourceforge.\n        </p>\n\n        <footer>\n          <p>2026-03-31</p>\n          <p>\n            If you rolled your eyes at how obvious this is, or have a better idea, please email us\n            at\n            <a href=\"mailto:hiring@anterior.com\">hiring@anterior.com</a>.\n          </p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260330\">\n        <h1>Upstream contributions to Dune</h1>\n        <p>\n          While building\n          <a href=\"https://github.com/anteriorcore/dune2nix\">dune2nix</a>, Shun ran into some\n          lockfile issues in <a href=\"https://github.com/ocaml/dune\">Dune</a> and submitted patches\n          to fix them:\n        </p>\n\n        <ul>\n          <li>\n            <a href=\"https://github.com/ocaml/dune/pull/13901\"\n              >fix(pkg): prefer stronger hash in lock (#13901)</a\n            >: Dune picked the first checksum in Opam metadata. Lexicographically\n            <strong>m</strong>d5 comes before <strong>s</strong>ha256/<strong>s</strong>ha512, so\n            Dune would use MD5 even when stronger hashes were available. The PR makes Dune prefer\n            the strongest available hash.\n          </li>\n          <li>\n            <a href=\"https://github.com/ocaml/dune/pull/13915\"\n              >fix(pkg): allow locking relative path outside the workspace (#13915)</a\n            >: Relative paths outside the workspace couldn't be locked. Now they can.\n          </li>\n        </ul>\n\n        <p>\n          Dune has a Nix flake, so you can try these changes with: `nix run github:ocaml/dune#dune`\n        </p>\n\n        <footer>\n          <p>2026-03-30</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260326\">\n        <h1>dune2nix</h1>\n        <p>\n          We open-sourced\n          <a href=\"https://github.com/anteriorcore/dune2nix\">dune2nix</a>, a Nix library to turn\n          <a href=\"https://dune.build\">Dune</a>-based OCaml projects into Nix derivations.\n        </p>\n\n        <p>\n          Like <a href=\"https://github.com/pyproject-nix/uv2nix\">uv2nix</a> and\n          <a href=\"https://github.com/anteriorcore/package-lock2nix\">package-lock2nix</a>,\n          `dune2nix` parses Dune's lockfiles fully at Nix eval time, which gives us: no codegen, no\n          <a href=\"https://nix.dev/manual/nix/2.26/language/import-from-derivation\"\n            >Import From Derivation (IFD)</a\n          >, no hardcoded hash.\n        </p>\n\n        <p>Released under AGPLv3 (but open to other licenses)</p>\n\n        <footer><p>2026-03-26</p></footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260319\">\n        <h1>xargs -n 1 ≠ xargs -I %</h1>\n\n        <p>Apparently `xargs -n 1 \U0001D465` ≠ `xargs -I % \U0001D465 %`</p>\n\n        <pre>\n  $ echo a b c | xargs -n 1 echo\n  a\n  b\n  c\n  $ echo a b c | xargs -I % echo %\n  a b c\n</pre\n        >\n\n        <p>No, you must instead:</p>\n\n        <pre>\n  $ echo a b c | xargs -n 1 | xargs -I % echo %\n  a\n  b\n  c\n</pre\n        >\n\n        <p>Why are you like this, POSIX? T_T</p>\n\n        <footer>\n          <p>2026-03-19</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260318\">\n        <h1>CDKTF provider bindings in Nix</h1>\n\n        <p>\n          We use\n          <a href=\"https://github.com/hashicorp/terraform-cdk\">CDKTF</a> but now that it's\n          deprecated, providers stopped publishing bindings. While we're migrate off it, we need to\n          generate provider bindings ourselves in the meantime. The official way of doing this is by\n          running `cdktf get`, but we got nerdsniped (as always), and wrote a little derivation that\n          generates provider bindings at Nix build time, in a sandboxed environment:\n        </p>\n\n        <pre>\n{\n  cdktf-cli,\n  writableTmpDirAsHomeHook,\n  nodejs,\n  terraform,\n  stdenv,\n  writeTextFile,\n  lib,\n\n  # We use https://github.com/nix-community/nixpkgs-terraform-providers-bin\n  #\n  # Something like:\n  #\n  # inputs.nixpkgs-terraform-providers-bin.legacyPackages.${system}.providers;\n  terraform-providers,\n}:\n\nlet\n  # Providers you want to generate bindings for\n  providers = with terraform-providers; [\n    hashicorp.aws\n    hashicorp.random\n    hashicorp.null\n  ];\n\n  # Language of the bindings\n  language = \"typescript\";\n\n  # Minimal cdktf.json used for geneting the bindings.\n  cdktfJson = writeTextFile {\n    name = \"cdktf.json\";\n    text = builtins.toJSON {\n      inherit language;\n      app = \"unused-can-be-anything\";\n      terraformProviders = map (\n        provider:\n        # Assuming registry.terraform.io because nixpkgs-terraform-providers-bin has\n        # an everlasting TODO: https://github.com/nix-community/nixpkgs-terraform-providers-bin/blob/4f8dfea41cd94403a6c768923b3ddcb15fd4c611/default.nix#L26\n        lib.replaceString \"registry.terraform.io/\" \"\" provider.provider-source-address\n      ) providers;\n    };\n  };\nin\nstdenv.mkDerivation {\n  name = \"cdktf-bindings\";\n\n  nativeBuildInputs = [\n    cdktf-cli\n    nodejs\n    (terraform.withPlugins (_: providers))\n    # cdktf wants to write in homedir for cache\n    writableTmpDirAsHomeHook\n  ];\n\n  dontUnpack = true;\n\n  # Disable telemetry, requires internet access.\n  CHECKPOINT_DISABLE = 1;\n\n  buildPhase = ''\n    cp ${cdktfJson} cdktf.json\n    cdktf get\n  '';\n\n  installPhase = ''\n    mkdir -p $out\n    cp -r .gen/* $out/\n  '';\n}\n        </pre>\n\n        <p>\n          Writing this was fun, but maintaining it would not be fun. Given that CDKTF is officially\n          deprecated, we have chosen to just directly vendor the bindings for now, while we migrate\n          off of CDKTF entirely. That being said, we thought this was a cool little snippet and\n          rather than bin it, we wanted to send it out into the ether on its own journey. Maybe he\n          can find someone out there who can properly appreciate him :)\n        </p>\n\n        <p>さよなら、CDKTF。</p>\n\n        <footer>\n          <p>2026-03-18</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260315\">\n        <h1>sync recent nix store items to cache</h1>\n\n        <p>\n          To populate your binary cache with e.g. the last 24 hours’ worth of derivations from your\n          machine’s /nix/store you can use:\n        </p>\n\n        <pre>\n  $ nix path-info --all --json \\\n    | jq -r 'with_entries(select(.value.registrationTime > (now - 60 * 60 * 24))) | keys | .[]' \\\n    | xargs -r nix copy --to ....\n</pre\n        >\n\n        <p>Or for Cachix you can use:</p>\n\n        <pre>\n    ...\n    | xargs -r cachix push my-cache-name\n</pre\n        >\n\n        <p>\n          Related: neither of these tools’ native concurrency or chunking primitives seem to be\n          quite as reliable as just plain old multi process parallelism using xargs. In the end,\n          this always wins:\n        </p>\n\n        <pre>\n    ...\n    | xargs -P 20 -n 1000 -r ...\n</pre\n        >\n\n        <p>Kind of sad. :(</p>\n\n        <footer>\n          <p>2026-03-15</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260311\">\n        <h1>redis-py: retrying UNBLOCKED</h1>\n\n        <p>\n          Our brrr workers use\n          <a\n            href=\"https://github.com/anteriorcore/brrr/blob/8cd6fbaf39bd930be8ec05c1bcaa2582913bd00e/python/src/brrr/backends/redis.py#L30\"\n            >BLPOP</a\n          >\n          to consume jobs from Redis. After enabling redis-py's built-in retry (which covers\n          <a href=\"https://github.com/redis/redis-py/blob/v7.0.1/redis/asyncio/retry.py#L20-L23\"\n            >ConnectionError and TimeoutError</a\n          >), alerts kept firing during failovers:\n        </p>\n\n        <pre>\n  ResponseError: UNBLOCKED force unblock from blocking operation, instance state changed\n</pre\n        >\n\n        <p>\n          Redis\n          <a href=\"https://github.com/redis/redis/blob/7.4.2/src/blocked.c#L248-L284\"\n            >sends this when it boots a blocked client during failover</a\n          >. You can't just add `ResponseError` to `retry_on_error` -- it's the base class for OOM,\n          READONLY, NOPERM and others, most of which indicate a persistent problem. And redis-py\n          doesn't expose a structured error code for types it doesn't recognize. For `UNBLOCKED`,\n          you just get a generic `ResponseError` with the raw message string.\n        </p>\n\n        <p>\n          So we subclassed `Retry` to parse the\n          <a href=\"https://redis.io/docs/latest/develop/reference/protocol-spec#simple-errors\"\n            >RESP error type</a\n          >\n          ourselves and only retry on `UNBLOCKED`:\n        </p>\n\n        <pre>\n  def _redis_response_error_type(exc: ResponseError) -&gt; str:\n      message = str(exc).strip()\n      if not message:\n          return \"\"\n      return message.split(None, 1)[0].upper()\n\n  class CustomRetry(Retry):\n      async def call_with_retry(self, do, fail):\n          # same retry loop as Retry, but with an extra branch:\n          while True:\n              try:\n                  return await do()\n              except ResponseError as error:\n                  if _redis_response_error_type(error) == \"UNBLOCKED\":\n                      ... # backoff and retry\n                  raise  # OOM, READONLY, etc. -- don't retry\n              except self._supported_errors as error:\n                  ... # backoff and retry (ConnectionError, TimeoutError)\n</pre\n        >\n\n        <p>Replace `Retry` with `CustomRetry` and done. Alerts resolved!</p>\n\n        <footer>\n          <p>2026-03-11</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260304\">\n        <h1>csvtk</h1>\n\n        <p>\n          We’re fans of\n          <a href=\"https://bioinf.shenwei.me/csvtk/\">csvtk</a>, a CLI toolkit to manipulate CSV/TSV\n          files and pipelines in scripts. It makes for some elegant combinations with jq and awscli2\n          when building cleanup scripts etc.\n        </p>\n\n        <p>It wouldn’t be a CLI if it didn’t have some odd gotchas. Today:</p>\n\n        <pre>\n  $ printf '2026-03-04T17:00:00-04:00\\tfoo\\n1998-01-01T00:00:00+00:00\\tbar\\n' &gt; data.tsv\n  $ &lt;data.tsv csvtk add-header -tn date,name | csvtk filter2 -stf '$name &lt; \"goo\"'\n  date\tname\n  2026-03-04T17:00:00-04:00\tfoo\n  1998-01-01T00:00:00+00:00\tbar\n  $ &lt;data.tsv csvtk add-header -tn date,name | csvtk filter2 -stf '$name &lt; \"doo\"'\n  date\tname\n  1998-01-01T00:00:00+00:00\tbar\n  $ &lt;data.tsv csvtk add-header -tn date,name | csvtk filter2 -stf '$name &lt; \"aaa\"'\n  date\tname\n  $ &lt;data.tsv csvtk add-header -tn date,name | csvtk filter2 -stf '$name &gt; \"aaa\"'\n  date\tname\n  2026-03-04T17:00:00-04:00\tfoo\n  1998-01-01T00:00:00+00:00\tbar\n</pre\n        >\n        <p>So far, so good. But:</p>\n        <pre>\n  $ &lt;data.tsv csvtk add-header -tn date,name | csvtk filter2 -stf '$date &gt; \"aaa\"'\n  [WARN] row 1: Value '1.772658e+09' cannot be used with the comparator '&gt;', it is not a number\n  [WARN] row 2: Value '8.836128e+08' cannot be used with the comparator '&gt;', it is not a number\n  date\tname\n  $ &lt;data.tsv csvtk add-header -tn date,name | csvtk filter2 -stf '$date &gt; \"2026\"'\n  [WARN] row 1: Value '1.772658e+09' cannot be used with the comparator '&gt;', it is not a number\n  [WARN] row 2: Value '8.836128e+08' cannot be used with the comparator '&gt;', it is not a number\n  date\tname\n</pre\n        >\n\n        <p>What‽</p>\n        <p>Gemini has no idea. Thankfully, we have Shun, who figured out that:</p>\n\n        <blockquote>\n          <p>\n            Date constants (single quotes, using any permutation of RFC3339, ISO8601, ruby date, or\n            unix date; date parsing is automatically tried with any string constant)\n          </p>\n        </blockquote>\n\n        <p>\n          <cite\n            >-\n            <a href=\"https://github.com/Knetic/govaluate\"\n              >https://github.com/Knetic/govaluate</a\n            ></cite\n          >\n        </p>\n\n        <p>Sure enough, if you use a “fuller” date:</p>\n\n        <pre>\n  $ &lt;data.tsv csvtk add-header -tn date,name | csvtk filter2 -stf '$date &gt; \"2026-01-01\"'\n  date\tname\n  2026-03-04T17:00:00-04:00\tfoo\n  $ &lt;data.tsv csvtk add-header -tn date,name | csvtk filter2 -stf '$date &lt; \"2026-01-01T00:00:00+00:00\"'\n  date\tname\n  1998-01-01T00:00:00+00:00\tbar\n</pre\n        >\n\n        <p>Thanks, Shun and Shen ☺</p>\n\n        <footer>\n          <p>2026-03-04</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260303\">\n        <h1>binding access_token to clientAddress</h1>\n\n        <p>\n          Our CDN now transparently binds all access tokens to the IP of the client.\n          <a\n            href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cloudfront-functions.html\"\n            >CloudFront Functions</a\n          >\n          make this relatively pain free and fool proof.\n        </p>\n\n        <p>\n          When the origin server gives a web browser a login token, it mints a JWT and puts it in a\n          `Set-Cookie` header. This token is effectively equivalent to a username + password + 2FA\n          combo for the duration of the session. We’ve set up two CloudFront functions: one to add a\n          `clientAddress` to every outgoing JWT (and resign), and one to validate it on any incoming\n          token. The origin server is none the wiser, but if any token ever leaks, it can only be\n          used if you can convince CloudFront that you come from the same IP as the original user.\n        </p>\n\n        <p>Relevant excerpt from the “clientAddress enricher”:</p>\n\n        <pre>\n  const cookie = response.cookies[\"access_token\"];\n  if (!cookie) {\n    return response;\n  }\n  const decoded = _jwt_decode(cookie.value, secret);\n  const payload = decoded.payload;\n  payload[\"clientAddress\"] = event.viewer.ip;\n  const toSign = decoded.header + \".\" + Buffer.from(JSON.stringify(payload)).toString(\"base64url\");\n  response.cookies[\"access_token\"].value = toSign + \".\" + _sign(toSign, secret, SIGNING_METHOD);\n  return response;\n</pre\n        >\n\n        <p>... and the “jwt validator”:</p>\n\n        <pre>\n  if (payload.clientAddress && payload.clientAddress != event.viewer.ip) {\n    throw new Error(\"viewer ip does not match token clientAddress\");\n  }\n</pre\n        >\n\n        <p>\n          An important reason this works for us: our users don’t use mobile. We only serve people on\n          desktops with (relatively) static IPs. This technique won’t work for an arbitrary B2C\n          website.\n        </p>\n\n        <footer>\n          <p>2026-03-03</p>\n\n          <p>* Code samples adapted from production for presentation purposes</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260301\">\n        <h1>docsync</h1>\n\n        <p>\n          We maintain a <a href=\"https://github.com/anteriorcore/brrr\">brrr</a>\n          SDK in TypeScript and Python. They both provide implementations for the same backing\n          datastructures, and those classes provide the same docstrings. To avoid them going out of\n          sync, Shun created a tool called `docsync`. It scans docstrings with a\n          &lt;docsync&gt;SomeKey&lt;/docsync&gt; tag using treesitter, and compares them to be equal\n          across both languages. E.g.:\n        </p>\n\n        <pre>\n  /**\n   * A full brrr request payload.\n   *\n   * This is a low-level brrr primitive.\n   *\n   * The memo key must be generated by the instantiator of this class, and it\n   * must be deterministic: the \"same\" args and kwargs must always encode to the\n   * same memo key.\n   *\n   * Using the same memo key, we store the task and its argv here so we can\n   * retrieve them in workers.\n   *\n   * &lt;docsync&gt;Call&lt;/docsync&gt;\n   */\n  export interface Call {\n    ...\n</pre\n        >\n\n        <p>and:</p>\n\n        <pre>\n  @dataclass\n  class Call:\n      \"\"\"A full brrr request payload.\n\n      This is a low-level brrr primitive.\n\n      The memo key must be generated by the instantiator of this class, and it\n      must be deterministic: the \"same\" args and kwargs must always encode to the\n      same memo key.\n\n      Using the same memo key, we store the task and its argv here so we can\n      retrieve them in workers.\n\n      &lt;docsync&gt;Call&lt;/docsync&gt;\n      \"\"\"\n</pre\n        >\n\n        <p>We hooked it up to `nix flake check` so it’s automatically checked in CI.</p>\n\n        <p>\n          It’s in\n          <a\n            href=\"https://github.com/anteriorcore/brrr/tree/137527a284fa74699bcee9ab7752cbc6c3460824\"\n            >brrr @ 137527a</a\n          >\n          but we’ll probably move it out to its own repo at some point.\n        </p>\n\n        <footer>\n          <p>2026-03-01</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260228\">\n        <h1>Hosting Nix NYC meetup 3/18</h1>\n\n        <p>\n          We’ll be hosting the\n          <a\n            href=\"https://www.meetup.com/new-york-nix-users-group/events/312892666/?eventOrigin=group_upcoming_events\"\n            >next Nix NYC meetup, 3/18/26</a\n          >. See you there!\n        </p>\n\n        <footer>\n          <p>2026-02-28</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260227\">\n        <h1>UNIX_EPOCH + 1 second</h1>\n\n        <p>\n          Yesterday, Ben noticed this blog’s contents weren’t refreshing, even if you explicitly\n          clicked refresh; seeing changes required a hard refresh. Let’s look at the headers:\n        </p>\n\n        <pre>\n  $ curl -D /dev/stderr -s -o /dev/null https://電.anterior.app/auth/login.html\n  HTTP/2 200\n  content-type: text/html\n  content-length: 11233\n  date: Fri, 27 Feb 2026 20:42:51 GMT\n  cache-control: max-age=86400\n  accept-ranges: bytes\n  last-modified: Thu, 01 Jan 1970 00:00:01 GMT\n  vary: accept-encoding\n  x-cache: Miss from cloudfront\n  via: 1.1 a086f9674a01c7542c440ffacd39476a.cloudfront.net (CloudFront)\n  x-amz-cf-pop: JFK52-P9\n  x-amz-cf-id: 7_XCBzHLxLFTjlJuOa1cG0WLhZv_yQ_pZfYopz23SUWy0KJGkgn4IQ==\n  x-frame-options: DENY\n  content-security-policy: connect-src 'self' https://anterior-master-platform.s3.us-east-2.amazonaws.com/artifacts/ https://anterior-master-platform.s3.us-east-2.amazonaws.com/uploads/; default-src 'none'; font-src 'self'; form-action 'self' https://anterior-master-platform.s3.us-east-2.amazonaws.com/uploads/; img-src 'self'; manifest-src 'self'; media-src 'self'; script-src-elem 'self'; style-src-elem 'self'; upgrade-insecure-requests ; worker-src 'self';\n  x-content-type-options: nosniff\n  strict-transport-security: max-age=31536000; includeSubDomains; preload\n</pre\n        >\n\n        <p>\n          What’s that\n          <a\n            href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Last-Modified\"\n            >Last-Modified</a\n          >\n          header? That’s the time to which all files are set when stored in the /nix/store:\n        </p>\n\n        <pre>\n  $ nix eval --raw --expr 'builtins.toFile \"foo\" \"hello\\n\"' | xargs -r date -u -Iseconds -r\n  1970-01-01T00:00:01+00:00\n</pre\n        >\n\n        <p>\n          Unfortunately, even when you click refresh, a browser will send the\n          <a\n            href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/If-Modified-Since\"\n            >If-Modified-Since</a\n          >\n          header, and the server will say: nope, nothing changed since you last loaded this page;\n          <a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/304\"\n            >304 Not Modified</a\n          >. And the browser won’t get the new content.\n        </p>\n\n        <p>\n          So the solution would seem to be: stop static-web-server from sending the Last-Modified\n          header when that’s the value? A grep through their source code finds\n          <a\n            title=\"they already thought of it\"\n            href=\"https://github.com/static-web-server/static-web-server/blob/a4213e540ebd098e11332fed6db34f2e63654e56/src/response.rs#L40-L46\"\n            >this</a\n          >:\n        </p>\n\n        <pre>\n  // If the file's modified time is the UNIX epoch, then it's likely not valid and should\n  // not be included in the Last-Modified header to avoid cache revalidation issues.\n  let modified = meta\n      .modified()\n      .ok()\n      .filter(|&t| t != std::time::UNIX_EPOCH)\n      .map(LastModified::from);\n</pre\n        >\n\n        <p>\n          They already thought of it. So why isn’t it working for us? Taking a closer look at that\n          timestamp from the nix store: apparently it’s\n          <strong>*1 second*</strong> after the epoch. Not exactly the epoch. Sure enough, the Nix\n          source code\n          <a\n            href=\"https://github.com/nixos/nix/blob/5ce241cbfd0ccbe2d3ec49fd0497f35fcd429fd0/src/libstore/posix-fs-canonicalise.cc#L16\"\n            >confirms</a\n          >:\n        </p>\n\n        <pre>\n  const time_t mtimeStore = 1; /* 1 second into the epoch */\n</pre\n        >\n\n        <p>\n          Nooo. What’s easier, patching Nix, or patching static-web-server? Let’s try our hand at\n          editing some Rust through sed through Nix, in an overlay on our monorepo’s nixpkgs\n          instance:\n        </p>\n\n        <pre>\n  overlays = [\n    (self: super: {\n      ...\n      static-web-server = super.static-web-server.overrideAttrs {\n        prePatch = ''\n          ${self.gnused}/bin/sed \\\n            -i \\\n            -e 's/\\(\\.filter.*t\\) != .*UNIX_EPOCH/\\1 > (std::time::UNIX_EPOCH + std::time::Duration::from_secs(1))/' \\\n            src/response.rs\n        '';\n        # Some tests which implicitly relied on the above behavior now\n        # break.  Force an mtime update to fix.\n        postUnpack = ''\n          find . -exec touch -m {} +\n        '';\n      };\n    };\n  ];\n</pre\n        >\n\n        <p>Rebuild the web server and run it locally to test:</p>\n\n        <pre>\n  $ curl -D /dev/stderr -s -o /dev/null http://localhost:12345/auth/login.html\n  HTTP/1.1 200 OK\n  content-length: 11233\n  content-type: text/html\n  accept-ranges: bytes\n  vary: accept-encoding\n  cache-control: max-age=86400\n  date: Fri, 27 Feb 2026 20:57:34 GMT\n</pre\n        >\n\n        <p>Change a CSS rule, do a regular refresh, and: it works :)</p>\n\n        <footer>\n          <p>2026-02-27</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260226\">\n        <h1>Excess Verbiage</h1>\n\n        <p>\n          <img\n            src=\"/static/excess%20verbiage%20ant%20all%20services%20new%20york%20nix.avif\"\n            alt=\"Photo of Ben holding a laptop with Anterior lore: Excess verbiage, little alignment. Naming remains tough. - Anuj\"\n            width=\"600\"\n            height=\"400\"\n          />\n        </p>\n\n        <footer>\n          <p>2026-02-26</p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260224\">\n        <h1>ECS: Task Protection vs stopTimeout</h1>\n\n        <p>AWS Struggle of the day: graceful exit of ECS tasks handling long running async jobs.</p>\n\n        <p>\n          The clearest signal that ECS wants you to terminate is a SIGTERM, eventually followed by a\n          SIGKILL. The maximum grace period ECS grants you is\n          <a\n            href=\"https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_ContainerDefinition.html\"\n            >2 minutes</a\n          >. 2 minutes is too short for our long running async tasks. :(\n        </p>\n\n        <p>\n          It seems we are not alone. For such cases, ECS introduced\n          <a\n            href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-scale-in-protection.html\"\n            >task termination protection</a\n          >: tasks can self identify as protected, escaping downscaling until they’re done. This\n          definitely solves the problem for fleet with &lt;1✕ sustained job / worker load, notably\n          auto scaling fleet without parallel handling of jobs by workers. But if your workers\n          support handling concurrent jobs, it’s unlikely they’ll ever be completely out of any\n          work. And until they get a signal, they don’t know whether or not they’re “old”. :((\n        </p>\n\n        <p>\n          We settled on workers just scheduling themselves to gracefully exit every hour, so even in\n          times of sustained load there will be task rescheduling events which will give ECS the\n          opportunity to upgrade the tasks. But it’s convoluted, and it’s a hack on top of another\n          hack. Wouldn’t it be nicer if you could just set a delay of 2 hours between SIGTERM and\n          SIGKILL, instead of 2 minutes?\n        </p>\n\n        <footer>\n          <p>2026-02-24</p>\n\n          <p>\n            P.S.: if we’re wrong and you know how to do this properly, please send us an e-mail at\n            <a href=\"mailto:hiring@anterior.com\">hiring@anterior.com</a> and mention this post. We\n            could use your help :)\n          </p>\n        </footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260223\">\n        <h1>nix flake archive</h1>\n\n        <p>\n          Our new favorite nix command is\n          <a href=\"https://nix.dev/manual/nix/2.33/command-ref/new-cli/nix3-flake-archive\"\n            >`nix flake archive`</a\n          >: copy all flake inputs to your store, and/or to a binary cache. Goes very nicely with\n          <a href=\"https://nix.dev/manual/nix/2.33/command-ref/new-cli/nix3-copy\">`nix copy`</a>\n          to ensure private substituters always have all your flake inputs cached.\n        </p>\n\n        <p>To pipe this into `nix copy` (or Cachix’s `cachix push`), use:</p>\n\n        <pre>\n  nix flake archive --json \\\n  | jq '.. | .path? | strings' \\\n  | xargs nix copy --to ...\n  # or: cachix push my-cachix-bin\n</pre\n        >\n\n        <p>\n          <a\n            href=\"https://github.com/nixos/nix/blob/5ce241cbfd0ccbe2d3ec49fd0497f35fcd429fd0/src/nix/flake.cc#L1093-L1123\"\n            >The implementation</a\n          >\n          is surprisingly simple.\n        </p>\n\n        <footer><p>2026-02-23</p></footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260221\">\n        <h1>nix building a flake app</h1>\n\n        <p>\n          Does anyone know how you’re supposed to just <em>build</em> a flake app (not program)\n          without running it? Best we could come up with is:\n        </p>\n\n        <pre>\n  nix eval --raw --impure --expr \\\n    'let\n       f = builtins.getFlake \"git+file://${toString ./.}\";\n       prg = f.apps.${builtins.currentSystem}.foobar.program;\n     in\n       builtins.head (builtins.attrNames (builtins.getContext prg))' \\\n  | xargs -r nix-store -r\n</pre\n        >\n\n        <p>Surely there has to be a better way...</p>\n\n        <!-- If you know the answer we’d love to have you as a colleague.\n            E-mail us at hiring@anterior.com and mention this post. -->\n\n        <footer><p>2026-02-21</p></footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260219\">\n        <h1>codegen flake module</h1>\n\n        <p>\n          We open sourced our\n          <a href=\"https://github.com/anteriorcore/codegen\">codegen flake module</a>\n          for declaring auto generated files in your flake.\n        </p>\n\n        <p>Usage is as simple as:</p>\n\n        <pre>\n  $ nix run .#codegen\n</pre\n        >\n\n        <p>and:</p>\n\n        <pre>\n  $ nix flake check\n</pre\n        >\n\n        <footer><p>2026-02-19</p></footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260218\">\n        <h1>validating JWTs in CF edge functions</h1>\n        <p>\n          We installed an edge function in Cloudfront to validate any JWTs were signed by a known\n          JWT key. Copied almost verbatim from the\n          <a\n            href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/example_cloudfront_functions_kvs_jwt_verify_section.html\"\n            >Cloudfront docs</a\n          >.\n        </p>\n\n        <p>\n          We explicitly whitelisted certain subdirectories from this check, `/auth/*` among others,\n          to allow unauthenticated users to log in. That’s why we host this page on\n          `/auth/login.html` ☺\n        </p>\n\n        <p>\n          The benefit: extremely small surface area for the code which does JWT validation. Severely\n          limits impact of large amount of potential bugs in the origin.\n        </p>\n\n        <footer><p>2026-02-18</p></footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260217\">\n        <h1>flake module: checkBuildAll</h1>\n        <p>\n          When you publish a flake, a sane base level sanity check is usually: do my exposed\n          packages at least <em>build</em>? The checkBuildAll flake module does that:\n        </p>\n\n        <pre>\n  inputs.anterior-tools.url = \"github:anteriorcore/tools\";\n\n  ...\n\n  flake.parts.lib.mkFlake { inherit inputs; } {\n    imports = [\n      inputs.anterior-tools.flakeModules.checkBuildAll\n      ...\n</pre\n        >\n\n        <p>Now, `nix flake check` builds everything exposed through your flake’s `packages`.</p>\n\n        <p>\n          From our\n          <a href=\"https://github.com/anteriorcore/tools\">nix tools</a> repo.\n        </p>\n\n        <footer><p>2026-02-17</p></footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260216\">\n        <h1>NY Nix Meetup</h1>\n        <p>\n          We’ll be at the\n          <a href=\"https://www.meetup.com/new-york-nix-users-group/events/312892659/\"\n            >NY Nix Meetup this Wednesday</a\n          >. Looking forward to it!\n        </p>\n\n        <footer><p>2026-02-16</p></footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260215\">\n        <h1>brrr: high performance workflow scheduler</h1>\n        <p>\n          We also open sourced\n          <a href=\"https://github.com/anteriorcore/brrr\">brrr</a>; a library-only, high performance,\n          bring-your-own-infra workflow scheduler. Crucial feature: no central orchestrator → no\n          single point of failure.\n        </p>\n\n        <p>\n          TypeScript and Python implementations provided. Nix powered demo in the repo. Under active\n          development.\n        </p>\n\n        <footer><p>2026-02-15</p></footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260214\">\n        <h1>elasticmq and dynamodb in services-flake</h1>\n        <p>\n          Shun submitted patches to include\n          <a href=\"https://github.com/softwaremill/elasticmq\">elasticmq</a> and\n          <a\n            href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DynamoDBLocal.html\"\n            >dynamodb-local</a\n          >\n          in\n          <a href=\"https://github.com/juspay/services-flake\">services-flake</a>. They both got\n          merged, so you can now easily use them in\n          <a href=\"https://github.com/Platonic-Systems/process-compose-flake\">process-compose</a>:\n        </p>\n\n        <pre>\n  services.dynamodb-local.mydynamodb.enable = true;\n  services.elasticmq.myelasticmq.enable = true;\n</pre\n        >\n\n        <p>\n          PRs\n          <a href=\"https://github.com/juspay/services-flake/pull/639\">#639</a>\n          and\n          <a href=\"https://github.com/juspay/services-flake/pull/640\">#640</a>.\n        </p>\n\n        <footer><p>2026-02-14</p></footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260213\">\n        <h1>package-lock2nix</h1>\n        <p>\n          We open sourced\n          <a href=\"https://github.com/anteriorcore/package-lock2nix\">package-lock2nix</a>, a tool to\n          build NPM projects with a package-lock.json directly in Nix. Full package-lock.json\n          parsing is done <em>at eval time</em>, meaning no separate `*2nix` command stage to run.\n          Just `nix build` your project directly, and manage the package-lock.json file itself with\n          regular build tools like npm.\n        </p>\n\n        <p>Released under AGPLv3 (but open to other licenses)</p>\n\n        <footer><p>2026-02-13</p></footer>\n      </article>\n      <hr />\n\n      <article id=\"article-20260212\">\n        <h1>Anterior dev log</h1>\n\n        <p>\n          Launched the anterior dev log. We’re hosting it under /auth/login.html because that’s the\n          only path that our edge functions allow through unauthenticated.\n        </p>\n\n        <p>Chose a non-ascii app name to test the system’s handling of unicode.</p>\n\n        <footer><p>2026-02-12</p></footer>\n      </article>\n    </main>\n\n    <footer>\n      <p>© Copyright Anterior Inc. 2026</p>\n    </footer>\n  </body>\n</html>\n"

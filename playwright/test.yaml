                        - generic [ref=e5061]:
                          - generic [ref=e5062]:
                            - text: "The essay On Proof and Progress in Mathematics by a Field's medalist is worth reading:"
                            - paragraph [ref=e5063]:
                              - link "https://arxiv.org/abs/math/9404236" [ref=e5064] [cursor=pointer]:
                                - /url: https://arxiv.org/abs/math/9404236
                            - paragraph [ref=e5065]: He wrote it in 1994.
                            - paragraph [ref=e5066]: He writes about how he almost "destroyed" a subdiscipline in mathematics by becoming so good at it that he outclassed everyone. PhD students were advised to stay away from the whole field.
                            - paragraph [ref=e5067]: When he discovered this, he realized his error was that he was focusing on producing results, and not focusing on explaining his thought process. It's that thought process that is valuable in advancing the frontier - results alone won't do it. It didn't matter how many theorems he proved, if he was the only one who had the mental framework in mind on how to think about the whole field.
                            - paragraph [ref=e5068]: I'm sure we've come across abstruse books where every theorem has a rabbit being pulled out of a hat, whereas other readers find it intuitive. It's because the latter has developed a mental model for the discipline, and you haven't.
                            - paragraph [ref=e5069]: So he set about slowing down, and focusing on holding lots of seminars where he worked with other mathematicians to explain the thought process. Eventually others started publishing proofs of key theorems.
                            - paragraph [ref=e5070]: When people publish in a journal, they are not merely doing it to show the result. They are having a conversation with other mathematicians. If they cannot explain their own proof, they're not having a conversation.
                            - paragraph [ref=e5071]: This is why even decades after the Four Color Theorem was proved, plenty of mathematicians don't consider it "mathematics".
                          - paragraph [ref=e5073]:
                            - link "reply" [ref=e5076] [cursor=pointer]:

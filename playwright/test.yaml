                        - generic [ref=e6793]:
                          - generic [ref=e6794]:
                            - text: It’s not marketing. This guy could have signed up for one of those hundred million dollar salaries with a phone call and did not. I know several people who have met him and everyone says he’s the genuine article. He’s actually just devoted to human mathematics.
                            - paragraph [ref=e6795]: One tragic thing about all of this is that unlike almost every profession, mathematics actually has a kind of honesty. You honestly solve the problem or you don’t. The pecking order in mathematics at least used to have a grounding in actual abilities. People respect this guy because he’s actually legit.

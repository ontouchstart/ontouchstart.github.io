                        - generic [ref=e872]:
                          - generic [ref=e873]:
                            - text: I thought the point of publishing was a matter of dissemination, to make available for people to then try to understand it? This is like saying, I don’t like music, so I’m going to tear down the venue. Then, all music genres suffer as a result, and all of society does, too. This idea is no good.
                            - paragraph [ref=e874]: Somebody, eventually, somewhere would understand it, or at least aspire to understand it. And even if he doesn’t, what have they learned in the process? About themselves, about their environment? About failure? I would bet a lot. How useful then, can we say that it is, not because we can understand it, but because we can try? That is useful. This is about the journey. Sometimes the journey is the point.
                            - paragraph [ref=e875]: This is like if math was fascist, this is what would happen. When you start controlling the flow of knowledge like this, it will be bad news all around. And who is to say whether or not something can be understood?Aside from the math nazis.

                        - generic [ref=e3221]:
                          - generic [ref=e3222]:
                            - text: We have thousands of years of precedent that suggests that breakthroughs in mathematics tend to accumulate into broader technology breakthroughs in other domains.
                            - paragraph [ref=e3223]: That's a misconception. Only a tiny percentage of mathematics has seen any applications whatsoever. There are vast libraries full of mathematics no one (in this discussion, anyway) has ever heard of that no one reads anymore and has never been applied to anything.
                            - paragraph [ref=e3224]: This idea of trying to "prove all the math" with AI makes as much sense to me as using chess engines to try to "solve chess."

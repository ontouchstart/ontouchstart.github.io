                        - generic [ref=e4886]:
                          - generic [ref=e4887]:
                            - text: I noticed another thing a long time ago.
                            - paragraph [ref=e4888]: Some academic cultures have a tradition of formal debates. They are based on the premise that an educated person should be able to argue convincingly for or against any idea, regardless of whether they believe in it. A natural corollary is that you should not let convincing arguments convince you, as the merits of the argument have little to do with the merits of the idea itself.
                            - paragraph [ref=e4889]: LLMs have made the situation worse. People's ability to generate convincing arguments now greatly exceeds their ability to evaluate the value of ideas.

                            - text: "> There are vast libraries full of mathematics no one (in this discussion, anyway) has ever heard of that no one reads anymore and has never been applied to anything."
                            - paragraph [ref=e3254]: And that's an issue why? It would seem to me that producing that also produced the mathematics that revolutionized the world repeatedly for centuries. I would go further and claim that, if you want the mathematics that revolutionizes the world, there's no way to get it without advancing mathematics as a field broadly. Those are not two separate activities, and thinking that they are is indeed a misconception.
                            - paragraph [ref=e3255]: "> This idea of trying to \"prove all the math\" with AI makes as much sense to me as using chess engines to try to \"solve chess.\""
                            - paragraph [ref=e3256]: "You're right: \"prove all the math\" does not make sense on any level, and nobody serious would phrase any of this in that way. I certainly didn't."

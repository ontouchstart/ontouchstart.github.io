                            - text: Math is not about truths, at least not by the meaning of "truth" as a word in daily use.
                            - paragraph [ref=e2005]: Math has been almost purely arbitrary since ~ late 19th/early 20th century. There are uncountably many correct mathematical theorems. Almost all of them can't even be written in symbols. Even if you have a tape with infinite length (which is already longer than the whole physical universe!) filled with theorems, they are still only 0% of all correct theorems. That's how arbitrary math is.

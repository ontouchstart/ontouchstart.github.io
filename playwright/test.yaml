                        - generic [ref=e3477]:
                          - generic [ref=e3478]:
                            - text: People say similar things about automation of software engineering. Different, but similar.
                            - paragraph [ref=e3479]: I'm deeply suspicious. I do not yet have a concise statement for why, but a lot of literature on the sociology of knowledge work sort of points at my thoughts.
                            - paragraph [ref=e3480]: Section 5 of the Thurston article cited by Tao touches the elephant. Raduchel's article on the economics of software [2] also touches it.
                            - paragraph [ref=e3481]: I've tried to put words to this for a few years. I think I'm just going to start writing versions of it as see if that helps me shape the thought into something more concise.
                            - paragraph [ref=e3482]: "So, in the spirit of this article's style, here are some postulates:"
                            - paragraph [ref=e3483]: 1. There is a sociological process happening in the production function during knowledge work.
                            - paragraph [ref=e3484]: 2. That production function and the associated sociological process spans years or even decades, and must outlast many of the artifacts that are produced during the early years of the function.
                            - paragraph [ref=e3485]: 3. You cannot get the right lines of code or the right theorems proved without running that sociological process alongside the artifact production process.
                            - paragraph [ref=e3486]: 4. It is impossible to completely separate the sociological process from the artifact construction process. If you just iterate on artifacts then too much of the required hidden state is lost to make progress in the right direction. This is true even if you include distilled artifacts capturing pieces of the sociological process (eg meeting notes, documentation, commit logs, prompts).
                            - paragraph [ref=e3487]: 5. So you need that sociological process, or something like it, to still happen.
                            - paragraph [ref=e3488]: 6. For a lot of knowledge work that process plays out in extremely high-fidelity social interactions [3] that we have not yet captured in the datasets that would be required to reproduce those dynamics.
                            - paragraph [ref=e3489]: 7. And even if we do collect that data, our current architectures and training algorithms and hardware would be useless given the size of the datasets.
                            - paragraph [ref=e3490]: "So: the technology today gives us the ability to iterate on the production of artifacts. But it does not sufficiently simulate the social process which gives rise to the Right artifacts."
                            - paragraph [ref=e3491]: This isn't exactly what I actually think, but it's a version of the thing that I intuit when I watch heavy use of AI in both software projects and formalization projects. And simulating that process feels way harder than people are currently assuming.
                            - paragraph [ref=e3492]:

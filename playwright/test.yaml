                            - text: Is formal (aka "mathematical") logic part of mathematics? Now that's a philosophical question.
                            - paragraph [ref=e2253]: From my perspective, I feel you restated what I said with the opposite conclusion. You say that axioms "defines" mathematics. If I were Claude, I'd say that the word "define" is doing a lot of work, is load bearing or something like that.

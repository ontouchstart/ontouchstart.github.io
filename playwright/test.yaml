                        - generic [ref=e2191]:
                          - generic [ref=e2192]:
                            - text: I think Hardy would be very much on the same page with me, as well as Godel and many others. Mathematical truths exist independently from our feelings and processes to discover them. People do and should argue about which truths are interesting to pursue and refine, but all of them are out there to be discovered... or not.

                        - generic [ref=e2035]:
                          - generic [ref=e2036]:
                            - text: "> There are uncountably many correct mathematical theorems. Almost all of them can't even be written in symbols."
                            - paragraph [ref=e2037]: What are you talking about? A theorem is a statement that has been proved from some axioms. A statement itself is a finite sequence of symbols satisfying some syntactical rules. The set of symbols for set theory, arithmetic, etc is finite, so the set of statements, and a fortiori the set of theorems, is at most countable. Where do you get the uncountability?
                            - paragraph [ref=e2038]: I suspect you are confusing theorems and theories. Assuming the set theory ZF (for instance) is consistent, then a consequence of Gödel's incompleteness theorem is that there are indeed uncountably many inequivalent extensions of ZF that are complete and consistent. Also, not a single one of these extensions can be described in symbols in the sense that there does not exist a computer program that enumerates a possible set of axioms for the extension.
                            - paragraph [ref=e2039]: As for your general point about arbitrariness, the late 19th century was a period when mathematicians started being concerned with the rigorous formalization of mathematics. Sure, there are some arbitrariness in the particular choice of formalization in the same way that the particular form of a programming language like C is arbitrary. However, the Gödel stuff has nothing to do with that arbitrariness, it is about the limit of formalization itself. The programming analogue is the undecidability of the halting problem. Saying that mathematics are arbitrary sounds to me a bit like saying that an algorithm like Quicksort is arbitrary because you saw an implementation in C and the particular form of the C language is arbitrary. Obviously, if you don't like the C language, you can implement Quicksort in another language. The same is true for mathematics. If some day, somebody finds a contradiction in ZF, or simply a new formalization that people find more convenient, then most mathematics will simply get translated and very little will change.

                        - generic [ref=e6255]:
                          - generic [ref=e6256]:
                            - text: Terence Tao sees a role for AI in science. I'm no genius but he basically described what I've thought all along... We don't need to be "all in" or "all out".
                            - paragraph [ref=e6257]: It's the old cliche of "if you only have a hammer every problem looks like a nail". Let's not fall into the trap of thinking that our life needs to be 100% about AI or completely devoid of AI. We can really use this thing to make our lives better.
                            - paragraph [ref=e6258]: Instead of wasting time on the question of whether we should use it, let's focus on HOW we'll use it.
                            - paragraph [ref=e6259]: "And one thing about Tao: it's really refreshing to have an influential genius \"around\" who isn't a egomaniacal psychopath trying to rule the world through their XYZ corporation but, instead, being a reasonable and well-balanced person. Big fan."

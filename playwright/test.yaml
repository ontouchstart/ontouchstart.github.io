                        - generic [ref=e5161]:
                          - generic [ref=e5162]:
                            - text: Would you hire a SW engineer that only showcases output from compilers, and can't explain the assembly that it wrote?
                            - paragraph [ref=e5163]: Since even the engineers that know what's going on aren't actually reading all of the AI output any more (or, if they are, they're not keeping up with their peer's output), why would you care? I don't think humans should waste time trying to understand their code, it's too slow and costly, and the understanding will be blown away the next time the AI changes it anyways.
                            - paragraph [ref=e5164]: Software engineering is becoming pasting in vague-ish descriptions of what you want, and then manually testing that what the AI developed is close enough. It seems like math can go in the same direction too, with useful results that improve our technology getting put into a database for other AIs to consume. Removing humans from the loop can speed things up, especially as AI improves, especially when it reaches a self-improvement loop.
                            - paragraph [ref=e5165]: As I keep saying, software is no longer skilled labor. Who knows, math may go in the same direction.

<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam Liu | {{ page.title | default: page.url }} </title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
      body.dark-mode {
        background-color: #0d1117 !important;
        color: #e6edf3 !important;
      }
      body.dark-mode .markdown-body {
        color: #e6edf3 !important;
      }
      body.dark-mode .markdown-body p,
      body.dark-mode .markdown-body blockquote,
      body.dark-mode .markdown-body ul,
      body.dark-mode .markdown-body ol,
      body.dark-mode .markdown-body dl,
      body.dark-mode .markdown-body table,
      body.dark-mode .markdown-body pre {
        color: #e6edf3 !important;
      }
      body.dark-mode .markdown-body blockquote {
        border-left-color: #30363d !important;
      }
      body.dark-mode .markdown-body a {
        color: #58a6ff !important;
      }
      body.dark-mode .markdown-body hr {
        background-color: #30363d !important;
      }
      body.dark-mode .markdown-body code,
      body.dark-mode .markdown-body tt {
        background-color: rgba(110, 118, 129, 0.4) !important;
      }
      body.dark-mode .markdown-body pre {
        background-color: #161b22 !important;
      }
      body.dark-mode .markdown-body table tr {
        background-color: #161b22 !important;
      }
      body.dark-mode .markdown-body table th,
      body.dark-mode .markdown-body table td {
        border-color: #30363d !important;
      }
      body.dark-mode .markdown-body .highlight {
        background-color: #161b22 !important;
      }
      #dark-mode-toggle {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 1000;
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #ccc;
        background: #fff;
        color: #000;
        transition: all 0.3s;
      }
      #dark-mode-toggle:hover {
        background-color: #f0f0f0;
      }
      body.dark-mode #dark-mode-toggle {
        background-color: #21262d;
        color: #c9d1c9;
        border-color: #30363d;
      }
    </style>
  </head>
  <body class="markdown-body dark-mode">
    <button id="dark-mode-toggle" aria-label="Toggle Dark Mode">🌙</button>
    <div class="container-lg px-3 my-5 markdown-body">
      {{ content }}
      <footer>
        <p>
          &copy; 2026
          <a href="/">Sam Liu</a>
          <a href="/engineering">👨🏻‍💻</a>
          <a href="/running">🏃🏻‍♂️</a>
        </p>
	<p id="userAgent"></p>
      </footer>
    </div>
  </body>
  <script>
    const toggle = document.getElementById('dark-mode-toggle');
    const body = document.body;
    
    if (localStorage.getItem('theme') === 'light') {
      body.classList.remove('dark-mode');
    }
    
    toggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    document.querySelector("#userAgent").innerText = navigator.userAgent;
  </script>
</html>
